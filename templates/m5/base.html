{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Back office{% endblock %} | Mieruka</title>
<link rel="icon" type="image/png" href="{% static 'kitty.png' %}">
<style>
:root{
  --bg:#f2f7f6; --surface:#ffffff; --ink:#172f46; --muted:#60778a; --line:#dbe5e3;
  --accent:#cd181f; --accent-soft:#fbe3e4; --ok:#1f7a4d; --ok-soft:#dcf1e6;
  --warn:#9a6200; --warn-soft:#fbf0d6; --chart:#cd181f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1f26; --surface:#252a33; --ink:#f4f3ee; --muted:#c0c7d0; --line:#343a46;
    --accent:#ff6b6b; --accent-soft:#3a1d22; --ok:#6fd3a0; --ok-soft:#1d3a2c;
    --warn:#f2c46b; --warn-soft:#3a3120; --chart:#ff6b6b; color-scheme:dark;}
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:inherit}
header.top{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px;
  padding:14px 16px; border-bottom:1px solid var(--line); background:var(--surface);}
.brand{font-weight:800; font-size:18px; text-decoration:none; margin-right:auto;}
.brand span{color:var(--accent)}
.who{font-size:13px; color:var(--muted); display:flex; gap:10px; align-items:center;}
.who button{font:inherit; color:inherit; background:none; border:1px solid var(--line);
  border-radius:8px; padding:3px 10px; cursor:pointer;}
nav.tabs{display:flex; gap:4px; padding:8px 12px; overflow-x:auto; background:var(--surface);
  border-bottom:1px solid var(--line);}
nav.tabs a{padding:7px 12px; border-radius:999px; text-decoration:none; white-space:nowrap;
  color:var(--muted); font-weight:600; font-size:14px;}
nav.tabs a[aria-current="page"]{background:var(--accent-soft); color:var(--accent);}
main{max-width:1180px; margin:0 auto; padding:20px 16px 48px; display:grid; gap:20px;}
h1{font-size:24px; margin:0;}
h2{font-size:15px; margin:0 0 12px;}
.sub{color:var(--muted); margin:2px 0 0; font-size:14px;}
.badge{display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px;
  background:var(--warn-soft); color:var(--warn); vertical-align:middle;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0;}
.kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px;}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px;}
.kpi .label{font-size:13px; color:var(--muted);}
.kpi .value{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2;}
.kpi .note{font-size:12px; color:var(--muted);}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:20px;}
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:14px;}
th{text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
  font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.mono{font-family:ui-monospace,Consolas,monospace; font-size:13px; white-space:nowrap;}
.muted{color:var(--muted)}
.pill{display:inline-block; font-size:12px; font-weight:700; padding:1px 8px; border-radius:999px; white-space:nowrap;}
.pill.actif{background:var(--ok-soft); color:var(--ok);}
.pill.hors_ligne{background:var(--accent-soft); color:var(--accent);}
.pill.non_associe{background:var(--line); color:var(--muted);}
.pill.open{background:var(--accent-soft); color:var(--accent);}
.pill.done{background:var(--ok-soft); color:var(--ok);}
form.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
form.filters input,form.filters select{font:inherit; color:inherit; background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:0;}
form.filters input[type=search]{flex:1 1 200px;}
form.filters button,.btn{font:inherit; font-weight:600; border:0; border-radius:8px; padding:7px 14px;
  background:var(--accent); color:#fff; cursor:pointer; text-decoration:none;}
.seg{display:flex; gap:4px; flex-wrap:wrap;}
.seg a{padding:5px 12px; border-radius:999px; border:1px solid var(--line); text-decoration:none; font-size:14px;}
.seg a[aria-current="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.pager{display:flex; gap:12px; align-items:center; justify-content:flex-end; font-size:14px; margin-top:12px;}
.empty{color:var(--muted); padding:16px 0; text-align:center;}
svg.chart{width:100%; height:auto; display:block;}
svg.chart .area{fill:var(--chart); opacity:.12}
svg.chart .line{fill:none; stroke:var(--chart); stroke-width:2.5; stroke-linejoin:round}
svg.chart text{fill:var(--muted); font-size:11px}
svg.chart .axis{stroke:var(--line)}
@media (max-width:600px){
  /* the chart's viewBox is 720 wide, so scale text and line up on phones */
  svg.chart text{font-size:24px}
  svg.chart .line{stroke-width:5}
}
.list{list-style:none; margin:0; padding:0; display:grid; gap:10px;}
.list li{display:grid; gap:2px; padding-bottom:10px; border-bottom:1px solid var(--line);}
.list li:last-child{border-bottom:0; padding-bottom:0}
dl.facts{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0;}
dl.facts dt{color:var(--muted)} dl.facts dd{margin:0; font-weight:600}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="{% url 'm5:index' %}"><span>Mieruka</span> back office</a>
  <span class="badge" title="Demo data generated by the simulator">Simulated data</span>
  <div class="who">
    <span>{{ request.user.get_username }}</span>
    <a href="{% url 'admin:index' %}">Admin</a>
    <form method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
  </div>
</header>
<nav class="tabs" aria-label="Back office">
  {% for url_name, label in nav %}
  <a href="{% url url_name %}"{% if active == url_name %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
