{% load static %}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16171c">
    <meta name="description" content="Mieruka: per-device measurement, explainable AI, rewarded savings.">
    <title>Mieruka</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'mieruka/mieruka-app-icon-v8-rounded.svg' %}">
    {% for css in css_files %}<link rel="stylesheet" href="{% static css %}">{% endfor %}
</head>
<body>
    <div id="root"></div>
    {% if js_file %}<script type="module" src="{% static js_file %}"></script>
    {% else %}<p style="font-family:system-ui;padding:2rem">Interface not built: run <code>npm run build</code> in <code>frontend/</code>.</p>{% endif %}
</body>
</html>
