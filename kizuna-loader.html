<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mieruka loader</title>
<style>
/* Packaged into the Android app as a local asset; the loader WebView blocks
   network requests, so everything here is inline and uses system fonts. */
:root{
  --bg:#f2f7f6; --ink:#1e1a17; --red:#cd181f; --track:#7a1216; --fill:#f8e9ae;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1c1f26; --ink:#fbf3d6;}
}
:root[data-theme="dark"]{--bg:#1c1f26; --ink:#fbf3d6;}
html{height:100%}
body{margin:0; height:100%; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:4vh; background:var(--bg); overflow:hidden;}

.mark{width:min(52vw,260px); height:auto; overflow:visible;
  animation:float 3.2s ease-in-out infinite;}
@keyframes float{50%{transform:translateY(-6px)}}
.tile{filter:drop-shadow(0 10px 18px rgb(205 24 31 / 28%))}

/* the meter ring fills, holds, then drains: one 2.4 s cycle */
.fill{stroke-dasharray:0 100; animation:meter 2.4s cubic-bezier(.55,0,.35,1) infinite}
@keyframes meter{
  0%  {stroke-dasharray:0 100;  stroke-dashoffset:0}
  62% {stroke-dasharray:100 0;  stroke-dashoffset:0}
  78% {stroke-dasharray:100 0;  stroke-dashoffset:0}
  100%{stroke-dasharray:0 100;  stroke-dashoffset:-100}
}
/* a spark rides the tip of the fill */
.spark{offset-path:path("M256 112 A150 150 0 1 1 255.99 112"); offset-rotate:0deg;
  animation:spark 2.4s cubic-bezier(.55,0,.35,1) infinite}
@keyframes spark{
  0%  {offset-distance:0%;   opacity:0}
  6%  {opacity:1}
  62% {offset-distance:100%; opacity:1}
  70%,100%{offset-distance:100%; opacity:0}
}
.kanji{transform-box:fill-box; transform-origin:50% 50%; animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{62%{transform:scale(1)} 70%{transform:scale(1.07)} 80%{transform:scale(1)}}
.hat{transform-box:fill-box; transform-origin:50% 100%; animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(0)} 30%{transform:rotate(-5deg)} 66%{transform:rotate(4deg)}}

.word{font:800 clamp(34px,10vw,52px)/1 system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  letter-spacing:.02em; color:var(--ink); display:flex;}
.word span{display:inline-block; transform-origin:50% 100%;
  animation:hop 2.4s infinite; animation-delay:calc(var(--i) * .09s)}
.word span:nth-child(-n+3){color:var(--red)}
@keyframes hop{
  0%  {transform:translateY(0) scale(1,1);          animation-timing-function:ease-out}
  6%  {transform:translateY(0) scale(1.06,.9);      animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  18% {transform:translateY(-14px) scale(.96,1.06); animation-timing-function:ease-in}
  30% {transform:translateY(0) scale(1.07,.88);     animation-timing-function:ease-out}
  40%,100%{transform:translateY(0) scale(1,1)}
}

@media (prefers-reduced-motion:reduce){
  .mark,.fill,.spark,.kanji,.hat,.word span{animation:none}
  .fill{stroke-dasharray:75 25}
  .spark{opacity:0}
}
</style>
</head>
<body>
<svg class="mark" viewBox="0 0 512 512" role="img" aria-label="Mieruka is loading">
  <defs><clipPath id="tile"><rect width="512" height="512" rx="115"/></clipPath></defs>
  <rect class="tile" width="512" height="512" rx="115" fill="#cd181f"/>
  <g clip-path="url(#tile)">
    <!-- meter ring: ink outline + pale track, then the animated fill -->
    <circle cx="256" cy="262" r="150" fill="none" stroke="#1e1a17" stroke-width="58"/>
    <circle cx="256" cy="262" r="150" fill="none" stroke="var(--track)" stroke-width="40"/>
    <g transform="rotate(-90 256 262)">
      <circle class="fill" cx="256" cy="262" r="150" pathLength="100" fill="none"
              stroke="#1e1a17" stroke-width="58" stroke-linecap="round"/>
      <circle class="fill" cx="256" cy="262" r="150" pathLength="100" fill="none"
              stroke="var(--fill)" stroke-width="40" stroke-linecap="round"/>
    </g>
    <circle class="spark" r="11" fill="#fffbe8" stroke="#1e1a17" stroke-width="5"/>
    <!-- 見える化 kanji -->
    <g transform="translate(256 262) scale(0.6) translate(-256 -256)">
    <path class="kanji" d="M296.34 287.06V344.92Q296.34 354.79 301.35 357.14Q306.06 359.2 321.81 359.2Q350.67 359.2 355.23 351.11Q358.32 345.37 360.09 315.33L360.38 310.33L382.47 318.42Q380.11 360.38 371.87 369.95Q363.33 379.96 320.48 379.96Q295.75 379.96 287.21 376.58Q274.26 371.72 274.26 355.23V287.06H233.47Q230.82 334.18 209.92 354.64Q187.54 375.99 141.02 386L129.53 365.68Q176.06 357.59 194.31 339.77Q209.77 324.75 211.24 287.06H166.05V126H345.95V287.06ZM187.69 144.7V173.41H323.87V144.7ZM187.69 191.81V220.37H323.87V191.81ZM187.69 238.48V268.37H323.87V238.48Z"
          fill="#ffffff" stroke="#1e1a17" stroke-width="16" stroke-linejoin="round" paint-order="stroke"/>
    </g>
  </g>
  <!-- hat (outside the clip so it can tip over the edge) -->
  <g transform="rotate(-10 256 80) translate(256 80) scale(1.35) translate(-165 -58)">
    <g class="hat" stroke="#1e1a17" stroke-linejoin="round" stroke-linecap="round">
      <path d="M110,104 C112,80 118,62 124,58 L206,58 C212,62 218,80 220,104 Z" fill="#d4483d" stroke-width="10"/>
      <ellipse cx="165" cy="58" rx="41" ry="9" fill="#a93a32" stroke-width="10"/>
      <path d="M200,62 Q216,80 210,102" fill="none" stroke="#fbf3d6" stroke-width="8"/>
      <circle cx="210" cy="104" r="8" fill="#fbf3d6" stroke-width="5"/>
    </g>
  </g>
</svg>
<div class="word" aria-hidden="true">
  <span style="--i:0">M</span><span style="--i:1">i</span><span style="--i:2">e</span><span style="--i:3">r</span><span style="--i:4">u</span><span style="--i:5">k</span><span style="--i:6">a</span>
</div>
</body>
</html>
