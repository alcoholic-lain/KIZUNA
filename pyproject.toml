[project]
name = "kizuna"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alcoholic-lain", email = "iwakura.lain.pa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth[socialaccount]>=65.22.1",
    "python-dotenv>=1.2.4",
    "turso-serverless==0.1.0",
    "vercel-blob>=0.5.0",
    "zeroconf>=0.154.0",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

# Runs during every Vercel build with that deployment's environment, so it
# migrates exactly the database the deployment uses. seed_demo only fills an
# empty database with labelled simulated data.
[tool.vercel.scripts]
build = "python manage.py migrate --noinput && python manage.py seed_demo --if-empty"

[project.scripts]
kizuna = "kizuna:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
